services:
  - type: web
    name: securenet-cep
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: securenet-db
          property: connectionString
      - key: SECURE_COOKIES
        value: "true"

databases:
  - name: securenet-db
    plan: free
    databaseName: securenet
    user: securenet
